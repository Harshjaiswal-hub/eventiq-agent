services:
  - type: web
    name: eventiq-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: "False"
      - key: SECURE_COOKIES
        value: "True"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FILE
        value: logs/eventiq.log
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/eventiq.db
    disk:
      name: eventiq-data
      mountPath: /var/data
      sizeGB: 1
