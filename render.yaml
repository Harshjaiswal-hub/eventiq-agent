services:
  - type: web
    name: eventiq-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: "False"
      - key: SECURE_COOKIES
        value: "True"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FILE
        value: logs/eventiq.log
      - key: SECRET_KEY
        generateValue: true
